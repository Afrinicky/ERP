[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nickland"
version = "0.1.0"
description = "Nickland ERP — offline-first business management platform"
requires-python = ">=3.12"
license = "Apache-2.0"

dependencies = [
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.32,<0.40",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "argon2-cffi>=23.1,<26.0",
    "python-multipart>=0.0.12,<0.1",
    "platformdirs>=4.3,<5.0",
    "weasyprint>=63,<67",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.3,<6.0"]
postgres = ["psycopg[binary]>=3.2,<4.0"]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<8.0",
    "httpx>=0.28,<0.30",
    "ruff>=0.8,<0.16",
    "mypy>=1.13,<2.0",
]

[project.scripts]
nickland = "nickland.desktop.__main__:main"
nickland-service = "nickland.interface.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "DTZ"]
ignore = ["A003", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/nickland/persistence/migrations/*" = ["E501", "I001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["nickland"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["webview.*", "alembic.*", "weasyprint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "postgres: requires a PostgreSQL database",
    "slow: long-running",
]
filterwarnings = [
    # Our own deprecations are errors; a dependency's internal ones are not ours to fix.
    "error::DeprecationWarning",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
    "ignore:Please use `import python_multipart` instead:PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src/nickland"]
branch = true
