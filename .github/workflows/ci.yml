name: Continuous integration

on:
  push:
    branches: ['**']
  pull_request:

env:
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '22'

jobs:
  service:
    name: Service — lint, types and tests
    # Ubuntu 24.04 carries the PostgreSQL 16 client tools, matching the service below;
    # newer runners carry only a later client, whose dumps can set options 16 rejects.
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nickland_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,postgres]'

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # The Phase 13 verifier and the packaging self-test read the built interface.
      - name: Build the interface
        working-directory: ui
        run: |
          npm ci
          npm run build

      # pg_dump and pg_restore, for the PostgreSQL backup and restore drill.
      - name: PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16

      - name: Lint
        run: ruff check src tests tools

      - name: Format
        run: ruff format --check src tests tools

      - name: Types
        run: mypy

      - name: Design tokens are current
        run: python tools/generate_tokens.py --check

      - name: Migrations apply and reverse — SQLite
        env:
          NICKLAND_DATA_DIRECTORY: ${{ runner.temp }}/nickland
        run: |
          mkdir -p "$NICKLAND_DATA_DIRECTORY"
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Migrations apply and reverse — PostgreSQL
        env:
          NICKLAND_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/nickland_test
          NICKLAND_DATA_DIRECTORY: ${{ runner.temp }}/nickland
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Phase exit criteria
        env:
          NICKLAND_DATA_DIRECTORY: ${{ runner.temp }}/nickland-verify
          NICKLAND_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/nickland_test
        run: |
          for phase in tools/verify_phase_*.py; do
            echo "::group::$phase"
            if [ "$phase" = "tools/verify_phase_15.py" ]; then
              # The whole suite on both engines is the next step; this runs the host criteria.
              # The database here is a container, so it listens beyond loopback by design.
              python "$phase" --skip-suite --database-in-container
            else
              python "$phase"
            fi
            echo "::endgroup::"
          done

      - name: Tests — both engines
        env:
          NICKLAND_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/nickland_test
        run: pytest --cov --cov-report=term-missing

  interface:
    name: Interface — types and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: interface
          path: ui/dist
          retention-days: 7

  security:
    name: Dependency and secret review
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit --strict --desc || echo '::warning::Review the advisories above.'

      - name: Scan for committed credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
