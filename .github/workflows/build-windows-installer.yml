name: Build Windows Installer

# Builds NicklandERP-Setup-<version>.exe on a Windows runner, the same way SECH_LIMS is
# packaged: run by hand from the Actions tab, or on every push to main, and uploaded as the
# Nickland_ERP_Windows_Installer artifact. A tag such as v0.2.0 also publishes it as a
# GitHub release.
#
# The installer holds the application frozen by PyInstaller (packaging/nickland.spec): the
# desktop program, the LAN host's command, the built interface, the migrations, and the
# GTK and Pango libraries WeasyPrint draws PDFs with, taken from MSYS2. Each build is
# self-tested before it is packaged: the frozen program must find its interface and its
# migrations and draw a PDF.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows-installer:
    name: Build Nickland ERP Windows installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build the interface
        working-directory: ui
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Install GTK and Pango (for PDF documents)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-pango

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install the application and PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install ".[desktop,postgres]" "pyinstaller>=6.10,<7"

      - name: Locate the GTK libraries
        shell: pwsh
        run: |
          $gtk = Join-Path "${{ steps.msys2.outputs.msys2-location }}" "mingw64"
          "NICKLAND_GTK_DIR=$gtk" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WEASYPRINT_DLL_DIRECTORIES=$gtk\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Version $version, GTK at $gtk"

      - name: Self-test from source
        shell: pwsh
        run: python -m nickland.desktop --self-test

      - name: Freeze the application (PyInstaller)
        shell: pwsh
        run: pyinstaller packaging/nickland.spec --noconfirm --distpath dist --workpath build

      - name: Self-test the frozen application
        shell: pwsh
        run: |
          # The desktop program has no console, so its result is read from its exit code.
          $test = Start-Process -FilePath "dist\NicklandERP\NicklandERP.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($test.ExitCode -ne 0) { Write-Error "The frozen application failed its self-test."; exit 1 }
          dist\NicklandERP\nickland-host.exe --help
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc "/DAppVersion=$env:APP_VERSION" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: List release output
        if: always()
        shell: bash
        run: |
          echo "Release folder contents:"
          ls -la release || true

      - name: Upload installer artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Nickland_ERP_Windows_Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish the release
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
